<style>

}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:#08070b;color:var(--fg);font:16px/1.5 var(--body);margin:0}

#app{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.04em}
h1{font-size:1.5rem;color:var(--ember)}
h2{font-size:1.1rem}
h3{font-size:.95rem;color:var(--throne)}
p{margin:0}
.lbl{font:600 .72rem var(--data);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.num{font-family:var(--data);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)} .ok{color:var(--aegis)} .bad{color:var(--blood)} .gold{color:var(--ember)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.rank{font:600 1rem var(--data);letter-spacing:.12em;text-transform:uppercase;color:var(--throne)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);padding:7px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}

.bar i{display:block;height:100%;background:var(--ember)}
.bar.b i{background:var(--blood)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--dim);font:600 .95rem var(--data);letter-spacing:.1em;text-transform:uppercase;padding:9px 12px;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ember);border-bottom-color:var(--ember)}
.pane{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card.story{border-left:3px solid var(--ember);background:linear-gradient(100deg,var(--panel2),var(--panel))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
button{font:600 .95rem var(--data);letter-spacing:.06em}
.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:9px 13px;cursor:pointer;text-align:left;min-height:40px}
.btn:hover:not(:disabled){border-color:var(--ember)}
.btn.pri{background:var(--ember);color:var(--ember-ink);border-color:var(--ember)}
.btn.dng{border-color:var(--blood);color:var(--blood)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn small{display:block;font:400 .8rem var(--body);letter-spacing:0;opacity:.85}
:focus-visible{outline:2px solid var(--throne);outline-offset:2px}
.col{display:flex;flex-direction:column;gap:8px}
.stat{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding:2px 0}
.stat span:last-child{font-family:var(--data);font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}

.hull{display:grid;gap:6px;max-width:420px;padding:14px 14px 14px 30px;background:var(--panel2);border:1px solid var(--line);clip-path:polygon(0 50%,9% 0,100% 0,100% 100%,9% 100%)}
.slot{aspect-ratio:1;border:1px dashed var(--line);background:var(--bg);color:var(--dim);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;min-width:0}
.slot b{font:600 1rem var(--data);letter-spacing:.06em}
.slot small{font:500 .68rem var(--data);letter-spacing:.08em}
.slot.f{border-style:solid}
.slot.w{color:var(--blood);border-color:var(--blood)} .slot.d{color:var(--aegis);border-color:var(--aegis)}
.slot.p{color:var(--ember);border-color:var(--ember)} .slot.u{color:var(--throne);border-color:var(--throne)}

#modal .sheet{background:var(--panel);border:1px solid var(--ember);width:100%;max-width:560px;max-height:100%;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
#arena{position:fixed;inset:0;z-index:30;background:#08070b;touch-action:none;user-select:none;-webkit-user-select:none}
#arena canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#arena button{position:absolute;right:max(14px,env(safe-area-inset-right,0px));background:rgba(31,26,38,.8);color:var(--throne);border:1px solid var(--throne);width:76px;height:52px;touch-action:none}
#bPause{top:calc(10px + env(safe-area-inset-top,0px));height:40px!important;width:48px!important}

#arena:not(.touch) #bDash,#arena:not(.touch) #bAct{display:none}
svg.map{width:100%;height:auto;background:var(--panel2);border:1px solid var(--line)}
svg.map text{font:600 11px var(--data);fill:var(--fg);letter-spacing:.05em}
svg.map .n{cursor:pointer}
</style>

  learn(id){const d=DOCS[id];if(S.credits<d.cost||S.rank<d.rank||S.docs.includes(id))return;S.credits-=d.cost;S.docs.push(id);save();render()},
  trial(){if(!canPromote()||!stats().ok||Game.g.enc)return;const nr=S.rank+1;Game.undock();
    Game.beginEnc(mkEnemy(S.rank+1,'Examiner\'s warship','duel'),{win:x=>{S.rank=nr;note('Promoted to '+RANKS[nr].n+'.');save();
      modal(`<p class="lbl">Promotion</p><h2>${RANKS[nr].n}</h2><p>${BRIEF[nr]}</p><p class="gold">${RANKS[nr].duty}</p>${x?`<p class="dim">${x}</p>`:''}<button class="btn pri" data-a="close">Continue</button>`)},
     lose:()=>report('Trial failed','The board declines to promote you. Dock and stand again when you are ready.')},Game.trialSite())},
  order(id,ci){const t=T.find(t=>t.id===id),c=t.ch[+ci];
    if(c.cost&&S.credits<Math.round(c.cost*stdC()))return;closeModal();
    if(c.out)return report(t.t,c.out.x,applyRw(c.out.rw));
    if(c.check){const pass=Math.random()*100<checkOdds(c.check),r=pass?c.pass:c.fail;return report(t.t+(pass?'':' (failed)'),r.x,applyRw(r.rw))}
    Game.beginEnc(mkEnemy(Math.max(0,S.rank+c.fight.mod),c.fight.n,c.fight.kind),{win:x=>report(t.t,c.fight.x,x+applyRw(c.fight.rw,true))});
  },
  node(i){sel=+i;render()},
  ending(k){S.ended=k;save();const txt=k==='crown'?'You take the Throne under a name that was never yours. The quotas continue. The deeps go quiet, and you learn to stop listening for them.':'You broadcast your birth record on every band: a Cinder, from Emberfall. Then you open the lift shafts. It is the last order you give as an admiral of the Concord and the first of something that has no name yet.';
    note(k==='crown'?'You took the crown.':'You broke the strata.');
    modal(`<p class="lbl">${k==='crown'?'Ending: The Crown':'Ending: The Open Deeps'}</p><h2>${k==='crown'?'Long may you reign':'Cinderborn'}</h2><p>${txt}</p><p class="dim">You hold ${held()} of ${NODES.length} systems. You can keep flying to take the rest.</p><button class="btn pri" data-a="close">Continue</button>`)}
};

/* ============ ANCHORAGE CONSOLE (shown only while docked) ============ */
const $=id=>document.getElementById(id);
function modal(html){$('modal').innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';$('modal').hidden=false;const b=$('modal').querySelector('button');if(b)b.focus()}
function closeModal(){$('modal').hidden=true;$('modal').innerHTML=''}
const pct=(a,b)=>Math.round(100*clamp(a/b,0,1));
function bar(a,b,cls){return`<div class="bar ${cls||''}"><i style="width:${b?pct(a,b):0}%"></i></div>`}
function render(){
  const next=S.rank<5?RANKS[S.rank+1].need:null,st=stats();
  const tabs=[['bridge','Bridge'],['yard','Shipyard'],['crew','Crew'],['college','College'],['sector','Sector']];
  $('app').innerHTML=`
  <div class="top"><div><h1>CINDERBORN</h1><span class="rank">${RANKS[S.rank].n} · docked</span></div>
    <button class="btn pri" data-a="launch" ${st.ok?'':'disabled'}>Launch<small>${st.ok?'Back to your ship':'Fix your ship in the Shipyard first'}</small></button></div>
  <div class="chips">
    <div class="chip"><span class="lbl">Credits</span><b>${S.credits}</b><span class="dim num" style="font-size:.8rem">+${income()} each payout</span></div>
    <div class="chip"><span class="lbl">Renown</span><b>${S.renown}${next?' / '+next:''}</b>${bar(S.renown-RANKS[S.rank].need,(next||S.renown)-RANKS[S.rank].need)}</div>
    <div class="chip"><span class="lbl">Ember</span><b>${S.ember}</b>${bar(S.ember,100)}</div>
    <div class="chip"><span class="lbl">Suspicion</span><b class="${S.sus>=75?'bad':''}">${S.sus}</b>${bar(S.sus,100,'b')}</div>
  </div>
  <nav class="tabs">${tabs.map(([k,n])=>`<button class="${tab===k?'on':''}" data-a="tab:${k}">${n}</button>`).join('')}</nav>
  <div class="pane">${({bridge:vBridge,yard:vYard,crew:vCrew,college:vCollege,sector:vSector})[tab]()}</div>`;
}
function vBridge(){
  const st=stats(),touch=matchMedia('(pointer:coarse)').matches;
  return`<div class="card story"><p class="lbl">${RANKS[S.rank].n}'s briefing</p><p>${BRIEF[S.rank]}</p><p class="gold">${RANKS[S.rank].duty}</p>
    ${canPromote()?`<div class="row"><button class="btn pri" data-a="tab:college">Your promotion trial is ready</button></div>`:S.rank<5?`<p class="dim">Next rank: ${RANKS[S.rank+1].n} at ${RANKS[S.rank+1].need} renown. ${RANKS[S.rank+1].duty}</p>`:''}
    ${!st.ok?`<p class="bad">Your ship cannot launch. ${st.weapons.length?'It draws more power than it makes.':'It has no weapons.'} Fix it in the Shipyard.</p>`:''}</div>
  <div class="grid2">
   <div class="card"><h3>How to fly and fight</h3>${touch?`<div class="keys"><b>LEFT THUMB</b><span>Fly</span><b>RIGHT THUMB</b><span>Aim. Guns fire while you hold it</span><b>DASH</b><span>Nothing can hit you mid-dash</span><b>DOCK / BOARD</b><span>Shows up beside your anchorage or a crippled warship</span></div>`
     :`<div class="keys"><b>W A S D</b><span>Fly</span><b>MOUSE</b><span>Aim. Hold click or Space to fire</span><b>SHIFT</b><span>Dash. Nothing can hit you mid-dash</span><b>E</b><span>Dock, or hold to board a crippled warship</span><b>ESC</b><span>Pause</span></div>`}
    <p class="dim">Orders reach you over comms while you fly and set a gold marker. Raiders roam the dark and pay bounties. A stipend and your holdings pay out every 75 seconds of flight.</p></div>
   <div class="card"><h3>${HULLS[S.hull].n}</h3>${shipStats(st)}</div>
  </div>
  <div class="card"><h3>Ship's log</h3><div class="col">${S.log.map(l=>`<p class="dim" style="font-size:.9rem">${l}</p>`).join('')}</div>
   <p class="dim"><b class="gold">Ember</b> is how far the deeps trust you. <b class="bad">Suspicion</b> is how close the Inquisitors are. At 100 you are exposed.</p>
   <div class="row"><button class="btn" data-a="askReset">Start a new career</button></div></div>`;
}
function shipStats(st){
  return`<div class="col">
   <div class="stat"><span>Hull</span><span>${st.hull}</span></div>
   <div class="stat"><span>Shield / regen</span><span>${st.sh} / ${st.regen}</span></div>
   <div class="stat"><span>Firepower per second</span><span>${st.fire}</span></div>
   <div class="stat"><span>Speed</span><span>${st.speed}</span></div>
   <div class="stat"><span>Boarding strength</span><span>${st.board||'none'}</span></div>
   <div class="stat"><span>Power</span><span class="${st.used>st.sup?'bad':''}">${st.used} / ${st.sup}</span></div>
   <div class="stat"><span>Crew</span><span>${S.crew.length} / ${st.crewCap}</span></div></div>`;
}
function vYard(){
  const h=HULLS[S.hull],st=stats();let side;
  if(sel==null||sel>=S.slots.length)side=`<p class="dim">Pick a bay on the hull to fit, upgrade or strip a module. What you fit here is the ship you fly.</p>`;
  else if(S.slots[sel]){const s=S.slots[sel],m=MODS[s.id],uc=m.cost*s.mk;
    side=`<h3>${m.n} Mk ${'I'.repeat(s.mk)}</h3><p class="dim">${m.d} at Mk I. Each mark adds half again. Draws ${m.pw} power.</p>
     <button class="btn pri" data-a="upgrade" ${s.mk>=3||S.credits<uc?'disabled':''}>${s.mk>=3?'Fully upgraded':'Upgrade to Mk '+'I'.repeat(s.mk+1)+' · '+uc+' credits'}</button>
     <button class="btn" data-a="sell">Strip and sell · +${Math.round(m.cost*.5)} credits</button>`}
  else side=`<h3>Fit bay ${sel+1}</h3>`+Object.entries(MODS).map(([id,m])=>`<button class="btn" data-a="install:${id}" ${S.rank<m.rank||S.credits<m.cost?'disabled':''}>${m.n} · ${m.cost} cr<small>${S.rank<m.rank?'Released at '+RANKS[m.rank].n:m.d+(m.pw?' · draws '+m.pw+' power':'')}</small></button>`).join('');
  const order=Object.keys(HULLS),nx=order[order.indexOf(S.hull)+1];
  return`<div class="grid2">
   <div class="card"><div class="row sp"><h3>${h.n}</h3><span class="num ${st.used>st.sup?'bad':'dim'}">Power ${st.used} / ${st.sup}</span></div>
    <div class="hull" style="grid-template-columns:repeat(${h.cols},1fr)">${S.slots.map((s,i)=>s?`<button class="slot f ${MODS[s.id].k}" data-a="slot:${i}" aria-label="${MODS[s.id].n}" ${sel===i?'style="outline:2px solid var(--throne)"':''}><b>${MODS[s.id].ab}</b><small>MK ${'I'.repeat(s.mk)}</small></button>`:`<button class="slot" data-a="slot:${i}" aria-label="Empty bay" ${sel===i?'style="outline:2px solid var(--throne)"':''}><b>+</b></button>`).join('')}</div>
    ${!st.ok?`<p class="bad">${st.weapons.length?'Over power budget. Add a reactor or strip a module before you launch.':'No weapons fitted.'}</p>`:''}
    ${shipStats(st)}</div>
   <div class="card">${side}</div></div>
  ${nx?`<div class="card"><h3>Next hull: ${HULLS[nx].n}</h3><p class="dim">${HULLS[nx].slots} bays, ${HULLS[nx].hull} base hull, ${HULLS[nx].crew} crew. Your modules transfer. Bigger hulls are slower.</p><div class="row"><button class="btn pri" data-a="buyHull:${nx}" ${S.rank<HULLS[nx].rank||S.credits<HULLS[nx].cost?'disabled':''}>${S.rank<HULLS[nx].rank?'Released at '+RANKS[HULLS[nx].rank].n:'Commission · '+HULLS[nx].cost+' credits'}</button></div></div>`:''}`;
}
function crewCard(c,btn){return`<div class="card"><div class="row sp"><h3>${c.name}</h3><span class="tag ${c.caste==='Cinder'?'gold':c.caste==='Zenith'?'':'dim'}">${c.caste}</span></div>
  <p>${ROLES[c.role]} · level ${c.lvl}${c.caste==='Cinder'&&S.ember>=40&&!c.cost?' <span class="gold">(+1, fights for you)</span>':''}</p><p class="dim" style="font-size:.88rem">${ROLE_D[c.role]}. ${CASTE_D[c.caste]}</p>${btn}</div>`}
function vCrew(){
  const st=stats(),full=S.crew.length>=st.crewCap;
  return`<div class="row sp"><h2>Aboard (${S.crew.length} / ${st.crewCap})</h2><span class="dim">Crew gain experience from every order you complete.</span></div>
  <div class="grid2">${S.crew.map((c,i)=>crewCard(c,`<div class="row sp"><span class="dim num">XP ${c.xp} / ${c.lvl<5?c.lvl*2:'max'}</span><button class="btn" data-a="dismiss:${i}">Dismiss</button></div>`)).join('')||'<p class="dim">Nobody. A ship flies without crew, but badly.</p>'}</div>
  <h2>Hiring hall</h2><p class="dim">New faces every time you dock.${full?' Your berths are full. Fit Crew Berths or commission a larger hull.':''}</p>
  <div class="grid2">${S.pool.map((c,i)=>crewCard(c,`<button class="btn pri" data-a="hire:${i}" ${full||S.credits<c.cost?'disabled':''}>Sign on · ${c.cost} credits</button>`)).join('')}</div>`;
}
function vCollege(){
  const st=stats(),nr=S.rank+1,busy=Game.g&&Game.g.enc;
  return`<div class="card story"><p class="lbl">Promotion board</p>${S.rank>=5?'<p>There is no rank above Admiral. There is only the Throne.</p>':
    `<h3>Trial for ${RANKS[nr].n}</h3><p>${canPromote()?'The board will see you. Launch, fly to the marker and defeat the examiner\'s warship.':'The board convenes at '+RANKS[nr].need+' renown. You have '+S.renown+'.'}</p>
    <div class="row"><button class="btn pri" data-a="trial" ${canPromote()&&st.ok&&!busy?'':'disabled'}>${busy?'Finish your current order first':'Launch for the trial'}</button></div>`}</div>
  <h2>Doctrines</h2><p class="dim">Permanent lessons. The College teaches more as you rise.</p>
  <div class="grid2">${Object.entries(DOCS).map(([id,d])=>{const has=S.docs.includes(id);return`<div class="card"><div class="row sp"><h3>${d.n}</h3>${has?'<span class="tag ok">Learned</span>':''}</div><p class="dim">${d.d}</p>${has?'':`<button class="btn" data-a="learn:${id}" ${S.rank<d.rank||S.credits<d.cost?'disabled':''}>${S.rank<d.rank?'Taught to '+RANKS[d.rank].n+'s':'Study · '+d.cost+' credits'}</button>`}</div>`}).join('')}</div>`;
}
function vSector(){
  let info='<p class="dim">Select a system. To take one, fly there as a Commander and break its garrison. The map in flight shows where you are.</p>';
  if(sel!=null&&NODES[sel]){const n=NODES[sel],o=S.own[sel],mine=o==='you';
    info=`<div class="row sp"><h3>${n.n}</h3><span class="tag" style="color:${HOUSES[o].c}">${HOUSES[o].n}</span></div>
     ${mine?`<p class="dim">${sel?'Pays '+n.inc+' credits each payout. You can dock here.':'Your home anchorage.'}</p>`:
     `<p class="dim">${sel===10?'The flagship Meridian and the Throne\'s guard. Only an Admiral may assault it.':'Garrison: a strength '+n.t+' warship with '+(1+Math.floor(n.t/2)+Math.floor(n.t/3))+' escorts. Open to Commanders and above.'} Worth ${n.inc} credits each payout.</p>`}`}
  return`<div class="row sp"><h2>The Meridian Sector</h2><span class="num gold">${held()} / ${NODES.length} systems held</span></div>
  <svg class="map" viewBox="0 0 600 420" role="img" aria-label="Sector map">
   ${LINKS.map(([a,b])=>`<line x1="${NODES[a].x}" y1="${NODES[a].y}" x2="${NODES[b].x}" y2="${NODES[b].y}" stroke="var(--line)" stroke-width="2"/>`).join('')}
   ${NODES.map((n,i)=>`<g class="n" data-a="node:${i}"><circle cx="${n.x}" cy="${n.y}" r="${i===10?17:13}" fill="${HOUSES[S.own[i]].c}" stroke="${sel===i?'var(--fg)':'var(--bg)'}" stroke-width="3"/><text x="${n.x}" y="${n.y+(i===10?34:29)}" text-anchor="${i===10?'end':'middle'}" ${i===10?'dx="18"':''}>${n.n}</text></g>`).join('')}
  </svg>
  <div class="row">${Object.values(HOUSES).map(h=>`<span class="tag" style="color:${h.c}">${h.n}</span>`).join('')}</div>
  <div class="card">${info}</div>`;
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;const[f,...a]=b.dataset.a.split(':');A[f](...a)});
S=load();if(!S){S=fresh();refresh();save()}
Game.start();
</script>
