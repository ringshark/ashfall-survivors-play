<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
		<title>Ashfall Survivors</title><meta name="description" content="Survive the fantasy frontier with automatic magic bolts and three manual spells.">
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		
html, body { width:100%; height:100%; background:#152521; overscroll-behavior:none; }
#status { background:#152521; }
#canvas { max-width:100vw; max-height:100vh; }
#status {
 position:fixed; inset:0; z-index:4; visibility:visible;
 box-sizing:border-box; padding:28px 20px;
 background:radial-gradient(ellipse at 50% 35%,#26324a 0%,#121b2b 48%,#080e17 100%);
 color:#e7ca86; font-family:system-ui,sans-serif; text-align:center;
}
.loading-emblem { padding:10px; margin-bottom:22px; border:1px solid #8c7955; border-radius:22px; box-shadow:0 0 42px #9a7d4220; }
.loading-emblem img { display:block; }
#loading-title { margin:0; font:500 clamp(30px,7vw,48px)/1.1 Georgia,serif; letter-spacing:.12em; }
#loading-title span { display:block; margin-top:8px; font-size:.52em; letter-spacing:.3em; }
#loading-caption { margin:22px 0 0; color:#b7c2d0; font-size:15px; }
#status-progress { position:relative; bottom:auto; width:min(320px,75vw); height:8px; margin:26px auto 0; accent-color:#d8bd7c; }
#loading-detail { margin:14px 0 0; color:#d7c8a6; font-size:13px; letter-spacing:.08em; min-height:20px; }
#status-notice { margin-top:20px; max-width:480px; }
@media (max-height:450px) {
 #status { padding:16px; }
 .loading-emblem { margin-bottom:12px; padding:6px; }
 .loading-emblem img { width:48px; height:48px; }
 #loading-title { font-size:30px; }
 #loading-caption { margin-top:14px; }
 #status-progress { margin-top:18px; }
}
</style>
		<link id="-gd-engine-icon" rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#152521"><link rel="manifest" href="manifest.webmanifest">
	</head>
	<body>
		<canvas id="canvas" aria-label="Ashfall Survivors game arena">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript><style>#status { display:none !important; }</style>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div class="loading-emblem" aria-hidden="true"><img src="favicon.svg" alt="" width="64" height="64"></div>
<h1 id="loading-title">ASHFALL<span>SURVIVORS</span></h1>
<p id="loading-caption">A moonlit refuge awaits.</p>
			<progress id="status-progress" aria-label="Loading game"></progress><p id="loading-detail" role="status">Loading…</p>
			<div id="status-notice"></div>
		</div>

		<script src="phone-controls.js"></script>
		<script src="phone-loader.js"></script>
		<script src="phone-performance.js"></script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":25137504,"index.wasm":43699190},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
GODOT_CONFIG.focusCanvas = !matchMedia('(pointer: coarse)').matches;
AshfallPerformance.configure(GODOT_CONFIG);
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const loadingDetail = document.getElementById('loading-detail');
	const loadingCaption = document.getElementById('loading-caption');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		loadingCaption.textContent = 'Unable to load the game';
		loadingDetail.textContent = 'Reopen to try again.';
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					loadingDetail.textContent = current >= total ? 'Starting game…' : 'Loading ' + Math.min(100, Math.floor(current / total * 100)) + '%';
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					loadingDetail.textContent = 'Preparing the game…';
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
